name: Link Checker

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly on Mondays at 3am UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build site
        run: npm run build
        env:
          CI: true

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-
            lychee-${{ runner.os }}-

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist './dist/**/*.html'
          fail: true
          jobSummary: true
          format: markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('./lychee/out.md')) {
              return;
            }
            const linkCheckOutput = fs.readFileSync('./lychee/out.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Link check results\n\n${linkCheckOutput}`
            });
